<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burger Drop 🍔</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Стили для рулетки золотого кейса */
  .roulette-view { display: flex; align-items: center; height: 100%; position: relative; }
  .roulette-strip { display: flex; transition: transform 0s; }
  .roulette-cell { width: 60px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-right: 1px solid #ffffff1a; margin: 0 3px; }
  .roulette-marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #ff0000; transform: translateX(-50%); z-index: 10; }
  .roulette-marker::before { content: '▼'; position: absolute; top: -10px; left: -6px; color: #ff0000; font-size: 14px; }
  
  /* Стили для кнопок пополнения */
  .deposit-btn { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; color: #fff; }
  .btn-crypto { background: linear-gradient(135deg, #f7931a, #ffb347); }
  .btn-sbp { background: linear-gradient(135deg, #2196F3, #0d47a1); }
  .crypto-box { display: none; background: #0000004d; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: left; }
  .crypto-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #4ca832; background: #000; color: #fff; }
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>
<div class="game">
 <div class="logo"><div class="logo-icon">🪙</div><div class="logo-text"><div class="top">Burger Drop</div><div class="sub">CASINO</div></div></div>
 
 <div id="authScreen" class="auth">
   <h2>Вход</h2>
   <input type="text" id="loginUser" placeholder="Email">
   <input type="password" id="loginPass" placeholder="Пароль">
   <div class="err" id="loginErr"></div>
   <button id="loginBtn">ВОЙТИ</button>
   <button class="link-btn" id="showReg">Нет аккаунта? Регистрация</button>
 </div>

 <div id="regScreen" class="auth" style="display:none">
   <h2>Регистрация</h2>
   <input type="text" id="regUser" placeholder="Email">
   <input type="password" id="regPass" placeholder="Пароль (мин. 6 символов)">
   <div class="err" id="regErr"></div>
   <button id="regBtn">СОЗДАТЬ</button>
   <button class="link-btn" id="showLogin">Назад ко входу</button>
 </div>

 <div id="gameScreen" style="display:none">
  <div class="userbar"><span>👤 <span id="userName">—</span></span><button id="logoutBtn">Выйти</button></div>
  <div class="balance"><span class="label">Баланс</span><span class="coins-val"><span id="balance">100</span> 🪙</span></div>
  
  <div class="tabs">
    <button class="tab active" data-panel="upgrader">🎡 Апгрейдер</button>
    <button class="tab" data-panel="mines">💣 Мины</button>
    <button class="tab" data-panel="crash">📈 Краш</button>
    <button class="tab" data-panel="deposit">💳 Пополнение</button>
    <button class="tab" data-panel="admin" id="adminTab" style="display:none">🛡 Админ</button>
  </div>
  
  <div class="panel active" id="panel-upgrader">
   <div class="wheel-wrap"><div class="wheel" id="wheel"></div><div class="hub-text" id="hubText">50%</div><div class="needle-spinner" id="needle"><div class="needle-arm"></div></div></div>
   <div class="row">
     <div><label>Ставка</label><input type="number" id="upgradeBet" value="10" min="1"></div>
     <div><label>Шанс (%)</label><input type="number" id="chance" value="50" min="0.1" max="99" step="0.1"></div>
   </div>
   <div class="preview"><div>Множитель: <span class="mult" id="multPreview">x2.00</span></div><div>Выигрыш: <span class="win-amt" id="winPreview">+20</span> 🪙</div></div>
   <div style="display: flex; gap: 10px; margin-bottom: 15px;">
     <button id="spinBtn" style="flex: 1; margin-bottom: 0;">КРУТИТЬ 🎡</button>
     <button id="fastSpinBtn" style="width: 60px; flex: none; padding: 0; font-size: 28px;">⚡</button>
   </div>
   <div class="result" id="result"></div>
  </div>

  <div class="panel" id="panel-mines">
    <div class="section-title">💣 Мины (5x5)</div>
    <div style="margin-bottom: 15px;">
      <div class="row">
        <div><label>Ставка</label><input type="number" id="minesBet" value="10" min="1"></div>
        <div><label>Мин</label><select id="minesCount"><option value="3">3</option><option value="5">5</option><option value="10">10</option></select></div>
      </div>
      <button id="minesStartBtn">НАЧАТЬ</button>
      <div id="minesGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px;"></div>
      <div id="minesStatus" class="result" style="margin-top: 10px;"></div>
      <button id="minesCashoutBtn" style="display:none; margin-top:10px;">ЗАБРАТЬ</button>
    </div>
  </div>

  <div class="panel" id="panel-crash">
    <div class="section-title">📈 Краш</div>
    <div style="display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px;" id="crashHistory"></div>
    <div style="background:#0a190a80; padding:20px; border-radius:12px;">
      <div id="crashMultiplier" style="font-size: 48px; font-weight: 900; color: #7ee06b; text-align: center;">x1.00</div>
      <div class="row">
        <div><label>Ставка</label><input type="number" id="crashBet" value="10" min="1"></div>
        <div><label>Авто-стоп</label><input type="number" id="crashAutoStop" value="2.0" min="1.1" step="0.1"></div>
      </div>
      <button id="crashStartBtn">СТАРТ</button>
      <button id="crashCashoutBtn" style="display:none;">ЗАБРАТЬ</button>
      <div id="crashStatus" class="result"></div>
    </div>
  </div>

  <!-- ОБНОВЛЕННЫЙ БЛОК ПОПОЛНЕНИЯ -->
  <div class="panel" id="panel-deposit">
    <div class="section-title">Пополнение</div>
    
    <button id="btnCrypto" class="deposit-btn btn-crypto">💰 Криптовалюта (USDT)</button>
    
    <div id="cryptoBox" class="crypto-box">
      <label style="display:block; margin-bottom:5px; font-size:12px; color:#b8d8a8;">Перевод по сети TON (TRC-20):</label>
      <input type="text" id="tonAddress" value="UQAf4h67v4H5_G4Q8U9v2j9U6H5G4Q8U9v2j9U6H5G4Q8U9" readonly>
      <button id="copyTonBtn" class="small" style="width:100%; margin-bottom:15px;">КОПИЯ</button>
      
      <label style="display:block; margin-bottom:5px; font-size:12px; color:#b8d8a8;">Калькулятор (100 монет = 0.90 USDT):</label>
      <input type="number" id="cryptoCoinsInput" placeholder="Кол-во монет" min="1">
      <div style="text-align:center; font-weight:bold; color:#ffcc00; font-size:18px;" id="cryptoUsdtAmount">0.00 USDT</div>
    </div>

    <button id="btnSbp" class="deposit-btn btn-sbp" style="margin-top:10px;">🏦 СБП (Перевод по РФ</button>
    
    <div style="text-align: center; font-size: 12px; color: #b8d8a8; margin-top: 20px;">
      По всем вопросам пишите в телеграмм <a href="https://t.me/pruneslo" target="_blank" style="color: #ff8c00;">@pruneslo</a>
    </div>
  </div>
  
  <div class="panel" id="panel-admin">
    <div class="section-title">🛡 Админ-панель</div>
    
    <div class="case-block">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">👥 Игроки</div>
      <button class="small" id="refreshPlayersBtn" style="margin-bottom: 10px; background: #4ca832;">ОБНОВИТЬ СПИСОК</button>
      <div id="adminPlayersList" style="max-height: 200px; overflow-y: auto; font-size: 12px; background: #0000004d; padding: 5px; border-radius: 8px;"></div>
      <div class="log" id="adminPlayersLog"></div>
    </div>

    <div class="case-block">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px">🎯 Подкрутка шансов</div>
      <div class="admin-field"><label>Email игрока</label><input type="text" id="adminTarget" placeholder="player@test.com"></div>
      <div class="admin-field"><label>Сумма монет</label><input type="number" id="adminCoins" value="1000"></div>
      <button class="small" id="adminGiveBtn" style="margin-top: 5px;">ВЫДАТЬ МОНЕТЫ</button>
      <div class="log" id="adminGiveLog"></div>
      
      <hr style="border-color:#ffffff1a; margin: 15px 0;">
      
      <div class="admin-field">
        <label>Выберите игрока:</label>
        <select id="adminChanceTarget" style="width: 100%; padding: 8px; margin-bottom: 5px;"></select>
      </div>
      <div class="admin-field">
        <label>Шанс (%)</label>
        <input type="number" id="adminChanceValue" value="10" min="0.1" max="99" step="0.1">
      </div>
      <button class="small" id="adminChanceBtn" style="margin-top: 10px;">ПРИМЕНИТЬ</button>
      <button class="small" id="adminChanceResetBtn" style="margin-top: 5px; background: #ff6b4a;">СБРОСИТЬ</button>
      <div class="log" id="adminChanceLog"></div>
    </div>
  </div>
 </div>
</div>

<!-- Поддержка (Робот) -->
<div id="supportBtn" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #2196F3, #0d47a1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; z-index: 90;">🤖</div>

<div class="modal-overlay" id="supportModal" style="z-index: 1000;">
  <div class="modal" style="max-width: 440px; display: flex; flex-direction: column; height: 80vh; padding: 15px;">
    <div class="close-modal" onclick="document.getElementById('supportModal').classList.remove('active')">×</div>
    <div class="modal-head" style="margin-bottom: 10px;">🤖 Техподдержка</div>
    
    <div id="playerChatView" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div id="supportMessages" style="flex: 1; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;"></div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="supportInput" placeholder="Сообщение..." style="flex: 1; padding: 10px; margin: 0;">
        <button id="supportSendBtn" class="small" style="width: 60px; margin: 0;">➤</button>
      </div>
    </div>

    <div id="adminChatView" style="flex: 1; display: none; flex-direction: column; overflow: hidden;">
      <div style="font-size: 13px; font-weight: 700; color: #2196F3;">Тикеты:</div>
      <select id="adminTicketSelect" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
      <div id="adminTicketsList" style="flex: 1; overflow-y: auto; margin-bottom: 10px; font-size: 12px; background: #0004; padding: 5px;"></div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="adminTicketInput" placeholder="Ответ..." style="flex: 1; padding: 10px; margin: 0;">
        <button id="adminTicketSendBtn" class="small" style="width: 60px; margin: 0;">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно для Золотого кейса -->
<div class="modal-overlay" id="caseModal" style="z-index: 1001;">
  <div class="modal" style="max-width: 440px; display: flex; flex-direction: column; padding: 15px; text-align: center;">
    <div class="modal-head" id="modalTitle" style="margin-bottom: 15px; font-size: 20px; color: #ffcc00;">🟡 ЗОЛОТОЙ КЕЙС</div>
    <div id="modalContents" style="margin-bottom: 15px;">
      <div id="modalRouletteWrap" style="position: relative; width: 100%; height: 80px; overflow: hidden; background: #00000080; border-radius: 10px; border: 2px solid #ffcc00;">
         <!-- Сюда скрипт вставит рулетку -->
      </div>
    </div>
    <div id="modalLog" style="color: #b8d8a8; font-size: 14px; margin-bottom: 15px; font-weight: bold;"></div>
    <button id="modalOpenBtn" style="margin-bottom: 0; background: linear-gradient(135deg, #ffcc00, #ff8c00); color: #000;">ЗАБРАТЬ</button>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
