<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Burger Drop 🍔</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#1f3a1f,#0f1a0f 60%,#071007);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#eaf5e6;padding:15px;overflow-x:hidden;position:relative}
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:floatGlow 12s ease-in-out infinite}
.bg-glow.g1{width:300px;height:300px;background:#ff8c00;top:-80px;left:-60px}
.bg-glow.g2{width:260px;height:260px;background:#4ca832;bottom:-70px;right:-50px;animation-delay:-4s}
.bg-glow.g3{width:200px;height:200px;background:#9b4dca;top:40%;right:10%;animation-delay:-8s;opacity:.35}
@keyframes floatGlow{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.15)}}
.bg-emoji{position:absolute;font-size:38px;opacity:.13;animation:drift linear infinite;filter:drop-shadow(0 0 6px #ff8c0066)}
@keyframes drift{0%{transform:translateY(110vh) rotate(0deg)}100%{transform:translateY(-20vh) rotate(360deg)}}
.bg-star{position:absolute;width:3px;height:3px;background:#ffcc66;border-radius:50%;opacity:.6;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.4)}}
.game{position:relative;z-index:2;background:linear-gradient(160deg,rgba(46,90,35,.72),rgba(20,40,15,.88));border:1px solid rgba(255,165,0,.4);padding:20px;border-radius:20px;width:100%;max-width:440px;text-align:center;box-shadow:0 10px 40px #000d,0 0 0 1px #ff8c0022 inset;backdrop-filter:blur(4px)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:15px}
.logo-icon{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#ff8c00 55%,#b35c00);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 15px #ff8c0099;animation:pulseLogo 2.5s ease-in-out infinite}
@keyframes pulseLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.logo-text{text-align:left;line-height:1.1}
.logo-text .top{font-size:22px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#7ee06b,#ffcc66,#ff8c00);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-text .sub{font-size:9px;letter-spacing:2px;color:#b8d8a8;text-transform:uppercase}
.auth{display:flex;flex-direction:column;gap:10px}
.auth h2{font-size:16px;color:#ffcc66;margin-bottom:5px}
.auth input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffa5004d;background:#0a190acc;color:#eaf5e6;font-size:16px;outline:none}
.auth .err{color:#ff6b4a;font-size:12px;min-height:16px}
.link-btn{background:none;border:none;color:#ffcc66;font-size:13px;text-decoration:underline;padding:5px;cursor:pointer}
.balance{font-size:16px;margin-bottom:15px;padding:12px;background:linear-gradient(135deg,#ff8c0033,#3c78264d);border:1px solid #ffa5004d;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.balance .label{opacity:.8;font-size:13px;text-transform:uppercase;font-weight:600}
.balance .coins-val{color:#ffcc66;font-weight:900;font-size:22px;display:flex;align-items:center;gap:5px}
.userbar{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px;color:#b8d8a8}
.userbar button{width:auto;padding:6px 12px;font-size:11px;background:#ff8c0033;color:#ffcc66;border:1px solid #ffa5004d;border-radius:6px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.tab{flex:1;min-width:70px;padding:10px 4px;border:1px solid #ffa50040;border-radius:10px;background:#0a190a99;color:#b8d8a8;font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer;transition:.2s}
.tab.active{background:linear-gradient(135deg,#ff8c004d,#4ca8324d);border-color:#ff8c00;color:#ffcc66;box-shadow:0 0 12px #ff8c0044}
.panel{display:none}
.panel.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wheel-wrap{position:relative;width:260px;height:260px;margin:0 auto 20px}
.wheel{width:100%;height:100%;border-radius:50%;position:absolute;inset:0;-webkit-mask:radial-gradient(circle,transparent 60px,#000 61px);mask:radial-gradient(circle,transparent 60px,#000 61px);box-shadow:0 0 0 6px #5a3a10,0 0 20px #ff8c004d;background:#1a2a15;transition:background .3s}
.hub-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;font-size:22px;font-weight:900;text-align:center;color:#ffcc66;text-shadow:0 0 10px #ff8c00cc;z-index:5;pointer-events:none;line-height:1}
.hub-text.streak{color:#c77dff;text-shadow:0 0 15px #c77dff;font-size:34px}
.hub-text.win{color:#7ee06b;font-size:16px;text-shadow:0 0 15px #7ee06b}
.hub-text.lose{color:#ff6b4a;font-size:16px;text-shadow:0 0 15px #ff6b4a}
.needle-spinner{position:absolute;top:50%;left:50%;width:0;height:0;z-index:10;pointer-events:none;transition:transform 2.5s cubic-bezier(.1,.8,.2,1);transform:rotate(90deg)}
.needle-arm{position:absolute;top:-10px;left:0;width:110px;height:20px;background:linear-gradient(90deg,transparent,#ffffff33);border-radius:10px}
.needle-arm:after{content:'';position:absolute;right:-10px;top:50%;transform:translateY(-50%);border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:20px solid #fff;filter:drop-shadow(0 0 4px #ffcc66)}
label{display:block;text-align:left;font-size:11px;margin-bottom:5px;color:#b8d8a8;text-transform:uppercase;font-weight:700}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>div{flex:1}
.bet-input-wrap{position:relative}
.bet-input-wrap input{padding-right:40px}
.bet-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
input[type=number],input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1px solid #ffa5004d;background:#0a190acc;color:#eaf5e6;font-size:16px;font-weight:600;outline:none}
.preview{background:#ff8c001a;border:1px dashed #ffa50066;border-radius:12px;padding:12px;margin-bottom:15px;font-size:13px;display:flex;justify-content:space-between;font-weight:600}
.preview .mult{color:#ffcc66}
.preview .win-amt{color:#7ee06b;font-size:16px}
button{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#7ee06b,#4ca832 50%,#ff8c00);color:#0f1a0f;font-size:16px;font-weight:900;cursor:pointer;text-transform:uppercase;transition:.1s}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.small{padding:10px;font-size:13px;border-radius:8px}
.result{margin-top:15px;font-size:15px;min-height:22px;font-weight:700}
.result.win
